<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN Valid Test App</title>
  <!-- Test app for PR reviewer action -->
</head>
<body>
  <h1>RudderStack CDN Valid Test</h1>
  <button id="signup-btn">Sign Up</button>

  <script>
    // RudderStack CDN Snippet (v3)
    window.RudderSnippetVersion = "3.2.0";
    var sdkBaseUrl = "https://cdn.rudderlabs.com";
    var sdkVersion = "v3";
    var sdkFileName = "rsa.min.js";

    !function(){var e=window.rudderanalytics=window.rudderanalytics||[];e.methods=["load","page","track","identify","alias","group","ready","reset","getAnonymousId","setAnonymousId"],e.factory=function(t){return function(){var r=Array.prototype.slice.call(arguments);return r.unshift(t),e.push(r),e}};for(var t=0;t<e.methods.length;t++){var r=e.methods[t];e[r]=e.factory(r)}e.loadJS=function(e,t){var r=document.createElement("script");r.type="text/javascript",r.async=!0,r.src=e;var n=document.getElementsByTagName("script")[0];n.parentNode.insertBefore(r,n)},e.loadJS(sdkBaseUrl+"/"+sdkVersion+"/"+sdkFileName),e.load("WRITE_KEY","https://dataplane.rudderstack.com")}();

    // Valid track calls
    rudderanalytics.track('page_loaded', {
      page: 'home',
      timestamp: Date.now(),
    });

    // Event listener with tracking
    document.getElementById('signup-btn').addEventListener('click', function() {
      rudderanalytics.track('button_clicked', {
        button_id: 'signup-btn',
        button_text: 'Sign Up',
      });
    });

    // Valid identify
    rudderanalytics.identify('user456', {
      email: 'user@example.com',
      name: 'Jane Doe',
    });

    // Valid page call
    rudderanalytics.page('Home', {
      url: window.location.href,
    });
  </script>
</body>
</html>
