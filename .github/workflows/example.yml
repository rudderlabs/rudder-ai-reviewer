# Example workflow file for using RudderStack PR Reviewer
# Copy this to your repository's .github/workflows/ directory

name: RudderStack PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    name: Analyze RudderStack SDK Changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run RudderStack PR Reviewer
        uses: ./
        with:
          # Required: Anthropic API key for AI analysis
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional: GitHub token (defaults to github.token)
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Optional: AI model to use (default: claude-sonnet-4-5)
          # Other options: claude-opus-4, claude-sonnet-3-5, etc.
          ai_model: 'claude-sonnet-4-5'

          # Optional: Max tokens per request (default: 64000)
          max_tokens_per_request: '64000'

          # Optional: Annotation mode (default: errors_warnings)
          # Options: errors_only, errors_warnings
          annotation_mode: 'errors_warnings'

# ============================================================================
# Advanced Configuration (Optional)
# ============================================================================

# You can also create a .rudderstack-pr-reviewer.yml config file in your repo:
#
# ai:
#   model: 'claude-sonnet-4-5'
#   max_tokens_per_request: 64000
# annotation_mode: 'errors_warnings'
