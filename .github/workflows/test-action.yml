name: Test Action

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          review-level: 'moderate'
