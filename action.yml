name: 'RudderStack PR Reviewer'
description: 'Analyzes RudderStack SDK instrumentation changes in pull requests'
author: 'RudderStack'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub token for PR comments and annotations'
    required: true
    default: ${{ github.token }}
  anthropic_api_key:
    description: 'Anthropic API key for AI-based analysis'
    required: true
  root_directory:
    description: 'Root directory to analyze (defaults to repository root). When set, analyzes ALL files in this directory, not just changed files. Useful for testing with sample apps.'
    required: false
  config_path:
    description: 'Path to config file (for future extensions)'
    required: false
    default: '.rudderstack-pr-reviewer.yml'
  review_unchanged_files:
    description: 'Post inline review comments even for files not changed in the PR (true/false) - for testing purposes only'
    required: false
    default: 'false'
  ai_model:
    description: 'AI model to use for analysis: claude-sonnet-4-5, claude-sonnet-3-4, claude-opus-4, etc.'
    required: false
    default: 'claude-sonnet-4-5'
  max_tokens_per_request:
    description: 'Maximum tokens per AI request (for chunking)'
    required: false
    default: '64000'
  annotation_mode:
    description: 'Annotation mode: errors_only, errors_warnings'
    required: false
    default: 'errors_warnings'

outputs:
  analysis_status:
    description: 'Status of the analysis: success, partial, failed'
  error_count:
    description: 'Number of errors found'
  warning_count:
    description: 'Number of warnings found'
  suggestion_count:
    description: 'Number of suggestions found'

runs:
  using: 'node24'
  main: 'dist/index.js'
